<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provincial Appointment System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <style>
        :root {
            --zabuto-primary: #ff8266;
            --zabuto-bg: #ffffff;
            --zabuto-header: #f2f2f2;
        }

        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .main-container {
            margin-top: 40px;
            margin-bottom: 40px;
        }

        /* Zabuto-style Calendar Card */
        .calendar-card {
            border: 1px solid #ddd;
            border-radius: 4px;
            background: var(--zabuto-bg);
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Customizing FullCalendar to look like Zabuto */
        #calendar {
            padding: 10px;
        }

        .fc {
            --fc-border-color: #eeeeee;
            --fc-button-bg-color: var(--zabuto-primary);
            --fc-button-border-color: var(--zabuto-primary);
            --fc-button-hover-bg-color: #ffa28d;
            --fc-today-bg-color: #faffbd;
        }

        /* Calendar Header (Zabuto Style) */
        .fc .fc-toolbar {
            background-color: var(--zabuto-header);
            margin: -10px -10px 10px -10px;
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .fc .fc-toolbar-title {
            font-size: 1.2rem !important;
            font-weight: bold;
            color: #555;
            text-transform: uppercase;
        }

        /* Day Cells */
        .fc .fc-daygrid-day {
            cursor: pointer;
            min-height: 80px;
        }

        .fc .fc-daygrid-day:hover {
            background-color: #e1f5fe !important;
        }

        .fc .fc-col-header-cell {
            background-color: #f9f9f9;
            padding: 10px 0;
            font-weight: 600;
            color: #777;
        }

        /* Form Card Styling */
        .appointment-card {
            border: none;
            border-top: 5px solid var(--zabuto-primary);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .required-label::after {
            content: " *";
            color: red;
        }

        @media (max-width: 768px) {
            .fc .fc-toolbar {
                flex-direction: column;
                gap: 8px;
            }
            .order-mobile-1 { order: 1; }
            .order-mobile-2 { order: 2; }
        }
    </style>
</head>
<body>

<div class="container main-container">
    <div class="row g-4">
        <div class="col-lg-5 order-mobile-2">
            <div class="card appointment-card p-4">
                <h3 class="fw-bold text-dark mb-1">Appointment Details</h3>
                <p class="small text-muted mb-4">Select a date on the calendar and fill out the form.</p>
                
                <form action="process_appointment.php" method="POST">
                    <div class="mb-3">
                        <label class="form-label required-label">Full Name</label>
                        <input type="text" class="form-control" name="full_name" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label required-label">Phone Number</label>
                            <input type="tel" class="form-control" name="phone" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label required-label">Address</label>
                        <input type="text" class="form-control" name="address" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label required-label">Office</label>
                        <select class="form-select" name="office" required>
                            <option value="" selected disabled>-- Select Office --</option>
                            <optgroup label="Executive">
                                <option value="governor">Office of the Governor</option>
                                <option value="vice-governor">Office of the Vice Governor</option>
                                <option value="administrator">Provincial Administrator</option>
                            </optgroup>
                            <optgroup label="Provincial Offices">
                                <option value="hr">Human Resource (HRMO)</option>
                                <option value="health">Provincial Health (PHO)</option>
                                <option value="agriculture">Provincial Agriculture</option>
                                <option value="engineering">Provincial Engineering</option>
                                <option value="treasurer">Provincial Treasurer</option>
                                <option value="assessor">Provincial Assessor</option>
                                <option value="accounting">Provincial Accounting</option>
                                <option value="budget">Provincial Budget</option>
                                <option value="planning">Planning & Development (PPDO)</option>
                                <option value="social-welfare">Social Welfare (PSWDO)</option>
                                <option value="legal">Provincial Legal Office</option>
                                <option value="vet">Provincial Veterinary</option>
                                <option value="general-services">General Services (GSO)</option>
                                <option value="pdrrmo">PDRRMO</option>
                                <option value="tourism">Provincial Tourism</option>
                                <option value="environment">PENRO-LGU</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label required-label">Date Selected</label>
                            <input type="text" class="form-control bg-light fw-bold" id="selectedDate" name="appointment_date" readonly required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label required-label">Time Slot</label>
                            <select class="form-select" name="appointment_time" required>
                                <option value="08:00">08:00 AM</option>
                                <option value="10:00">10:00 AM</option>
                                <option value="13:00">01:00 PM</option>
                                <option value="15:00">03:00 PM</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label required-label">Purpose of Visit</label>
                        <textarea class="form-control" name="notes" rows="2" required></textarea>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">Confirm Appointment</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-7 order-mobile-1">
            <div class="calendar-card">
                <div id="calendar"></div>
            </div>
            <div class="mt-3 p-2 small text-muted">
                <span class="badge bg-warning text-dark me-2"> </span> Click on a day to select your appointment date.
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var dateInput = document.getElementById('selectedDate');

        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            height: 'auto',
            headerToolbar: {
                left: 'prev',
                center: 'title',
                right: 'next'
            },
            selectable: true,
            validRange: {
                start: new Date().toISOString().split('T')[0]
            },
            dateClick: function(info) {
                // Update input
                dateInput.value = info.dateStr;
                
                // Zabuto-style selection (Blue background)
                document.querySelectorAll('.fc-daygrid-day').forEach(el => {
                    el.style.backgroundColor = '';
                    el.style.color = '';
                });
                info.dayEl.style.backgroundColor = '#33b5e5';
                info.dayEl.style.color = '#fff';
            }
        });

        calendar.render();
    });
</script>

</body>
</html>
