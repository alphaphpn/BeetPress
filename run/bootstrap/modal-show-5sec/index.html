<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Timed Modal Example</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container text-center mt-5">
        <h1>Welcome to My Page</h1>
        <p class="lead">Wait 5 seconds for the modal to pop up automatically...</p>
    </div>

    <!-- Bootstrap 5 Modal -->
    <div class="modal fade" id="autoShowModal" tabindex="-1" aria-labelledby="autoShowModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="autoShowModalLabel">Special Offer!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-content p-3">
                    <p>This modal automatically appeared after 5 seconds using vanilla JavaScript and Bootstrap 5's JS API.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS (Includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript to Trigger Modal After 5 Seconds -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
                const myModalElement = document.getElementById('autoShowModal');
                const myModal = new bootstrap.Modal(myModalElement);
                myModal.show();
            }, 5000); // 5000 milliseconds = 5 seconds
        });
    </script>
</body>
</html>
