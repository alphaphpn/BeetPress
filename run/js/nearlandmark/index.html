<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landmark Radius & Address Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h4 class="mb-0">Distance & Address Finder</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <div class="mb-4">
                            <label for="landmark-input" class="form-label fw-bold">Enter Nearest Landmark</label>
                            <input type="text" id="landmark-input" class="form-control form-control-lg" placeholder="e.g., Eiffel Tower, Golden Gate Bridge...">
                        </div>
                        
                        <div class="d-grid gap-2 mb-4">
                            <button id="calc-btn" class="btn btn-primary btn-lg">
                                <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                Calculate Radius
                            </button>
                        </div>

                        <div id="error-box" class="alert alert-danger d-none" role="alert"></div>

                        <div id="result-box" class="d-none">
                            <hr>
                            
                            <div class="alert alert-info border-0 shadow-sm mb-4">
                                <h6 class="alert-heading fw-bold mb-1">📍 Landmark Full Address:</h6>
                                <p id="landmark-address" class="mb-0 small text-dark">--</p>
                            </div>

                            <h5 class="text-secondary mb-3 text-center">Calculated Radius</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-6">
                                    <div class="p-3 bg-white border rounded text-center shadow-sm">
                                        <small class="text-muted d-block text-uppercase small">Kilometers</small>
                                        <span id="dist-km" class="fs-3 fw-bold text-primary">0.00</span> <span class="fw-medium">km</span>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="p-3 bg-white border rounded text-center shadow-sm">
                                        <small class="text-muted d-block text-uppercase small">Meters</small>
                                        <span id="dist-m" class="fs-3 fw-bold text-success">0.00</span> <span class="fw-medium">m</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="p-2 bg-light rounded text-center border-top">
                                <p class="mb-0 small text-muted"><strong>Your Coordinates:</strong> <span id="user-coords">--</span></p>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const landmarkInput = document.getElementById('landmark-input');
        const calcBtn = document.getElementById('calc-btn');
        const spinner = document.getElementById('btn-spinner');
        const errorBox = document.getElementById('error-box');
        const resultBox = document.getElementById('result-box');

        calcBtn.addEventListener('click', async () => {
            const query = landmarkInput.value.trim();
            
            if (!query) {
                showError("Please type a landmark name first.");
                return;
            }

            // Reset UI states
            errorBox.classList.add('d-none');
            resultBox.classList.add('d-none');
            calcBtn.disabled = true;
            spinner.classList.remove('d-none');

            if (!navigator.geolocation) {
                showError("Your browser doesn't support Geolocation.");
                return;
            }

            // 1. Fetch live user GPS location
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const userLat = position.coords.latitude;
                    const userLon = position.coords.longitude;
                    document.getElementById('user-coords').innerText = `${userLat.toFixed(4)}, ${userLon.toFixed(4)}`;

                    try {
                        // 2. Query Nominatim API with address details flag enabled (addressdetails=1)
                        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&q=${encodeURIComponent(query)}&limit=1`);
                        const data = await response.json();

                        if (data && data.length > 0) {
                            const landLat = parseFloat(data[0].lat);
                            const landLon = parseFloat(data[0].lon);
                            
                            // Extract full resolved address string
                            const fullAddress = data[0].display_name;
                            document.getElementById('landmark-address').innerText = fullAddress;

                            // 3. Compute Radius via Haversine Formula
                            const distanceInKm = haversineDistance(userLat, userLon, landLat, landLon);
                            const distanceInMeters = distanceInKm * 1000;

                            // 4. Bind values to UI elements
                            document.getElementById('dist-km').innerText = distanceInKm.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
                            document.getElementById('dist-m').innerText = distanceInMeters.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 0});
                            
                            resultBox.classList.remove('d-none');
                        } else {
                            showError("Could not find a landmark with that name. Try adding a city or country.");
                        }
                    } catch (err) {
                        showError("Error connecting to location search service.");
                    } finally {
                        calcBtn.disabled = false;
                        spinner.classList.add('d-none');
                    }
                },
                (error) => {
                    let msg = "Location access denied. Please enable GPS permissions.";
                    if(error.code === 3) msg = "Location request timed out.";
                    showError(msg);
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        });

        // Haversine Formula (returns KM)
        function haversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in KM
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; 
        }

        function toRad(value) {
            return value * Math.PI / 180;
        }

        function showError(message) {
            errorBox.innerText = message;
            errorBox.classList.remove('d-none');
            calcBtn.disabled = false;
            spinner.classList.add('d-none');
        }
    </script>
</body>
</html>
