<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>QR Code Reader</title>
	<script src="../../../assets/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
	<div style="width: 100%; max-width: 600px; margin: auto;">
		<div id="qr-reader" style="max-width: 360px; margin: auto;"></div>

		<hr>

		<input id="codehere" type="text" placeholder="Code here" style="margin: auto;" readonly>

		<hr>

		<div style="display: flex; gap: 1em; text-align: center; margin: auto; justify-content: space-between;">
			<a href="../../../">Home</a> | 
			<a href="tel:+639154826025" title="Ludwig Bethnicer C. Napigkit" target="_blank">Contact Us</a> | 
			<a href="mailto:alphaphpn@gmail.com" title="AlphaPHPn I.T. Services" target="_blank">E-mail</a> | 
			<a href="//facebook.com/alphaphpn" title="AlphaPHPn Facebook" target="_blank">facebook</a> | 
			<a href="javascript: location.reload()">Reload</a>
		</div>

	</div>

	<script>
		let codehere = document.getElementById("codehere");

		function docReady(fn) {
			if (document.readyState === "complete" || document.readyState === "interactive") {
				setTimeout(fn, 1);
			} else {
				document.addEventListener("DOMContentLoaded", fn);
			}
		}

		docReady(function() {
			var html5QrCode = new Html5Qrcode("qr-reader");
			html5QrCode.start(
				{ facingMode: "environment" }, // Use the back camera
				{
					fps: 10,    // frames per second
					qrbox: { width: 250, height: 250 } // size of scan box
				},
				(decodedText, decodedResult) => {
					// handle success: display decodedText
					// console.log(`QR Code detected: ${decodedText}`);
					codehere.value = decodedText;

					html5QrCode.stop().then(() => {
						console.log("QR Code scanner stopped.");
					}).catch(err => {
						console.error("Error stopping QR Code scanner:", err);
					});
				},
				(errorMessage) => {
					// handle error: log or display errorMessage
					// console.warn(`QR Code scanning error: ${errorMessage}`);
				}
			).catch((err) => {
				console.error("Unable to start QR Code scanner:", err);
			});
		});
	</script>
</body>
</html>
