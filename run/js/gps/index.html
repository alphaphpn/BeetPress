<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GPS Location</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS and JavaScript -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxXz+sJ1vU/fxmXzKzB1D6Q6w4Fv4q5P1f4Fv4P8="
        crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-2L+L4H/b5p/SjL2B9s9N3z1D6t6z7V6E5p4P4P4P4P4P4="
        crossorigin=""></script>
    
    <style>
        /* Custom styles for the map container */
        #map {
            width: 100%;
            height: 500px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-2xl text-center">
        <h1 class="text-3xl font-bold mb-4 text-gray-800">Find My Location</h1>
        <p id="status-message" class="text-gray-600 mb-6">
            Click the button below to get your current GPS location.
        </p>

        <button id="getLocationBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out">
            Get My Location
        </button>

        <div id="map-container" class="mt-8 hidden">
            <p id="coords-display" class="text-lg font-medium text-gray-700 mb-4"></p>
            <div id="map"></div>
        </div>
        
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusMessage = document.getElementById('status-message');
            const getLocationBtn = document.getElementById('getLocationBtn');
            const mapContainer = document.getElementById('map-container');
            const coordsDisplay = document.getElementById('coords-display');

            // Function to handle successful location retrieval
            function showPosition(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                
                // Display coordinates
                coordsDisplay.textContent = `Latitude: ${lat.toFixed(6)}, Longitude: ${lng.toFixed(6)}`;
                
                // Show the map container
                mapContainer.classList.remove('hidden');

                // Initialize the map
                const map = L.map('map').setView([lat, lng], 16); // Set a zoom level of 16 for detail

                // Add a tile layer to the map (this is the actual map imagery)
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
                }).addTo(map);

                // Add a marker to the map at the user's location
                const marker = L.marker([lat, lng]).addTo(map);

                // Add a popup to the marker
                marker.bindPopup("<b>You are here!</b>").openPopup();
                
                statusMessage.textContent = 'Location found successfully!';
                getLocationBtn.classList.add('hidden');
            }

            // Function to handle location retrieval errors
            function showError(error) {
                mapContainer.classList.add('hidden');
                getLocationBtn.classList.remove('hidden');

                let errorMessage = "";
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        errorMessage = "You denied the request for Geolocation. Please enable location access in your browser settings to use this feature.";
                        break;
                    case error.POSITION_UNAVAILABLE:
                        errorMessage = "Location information is unavailable. Please try again later.";
                        break;
                    case error.TIMEOUT:
                        errorMessage = "The request to get your location timed out. Please check your internet connection and try again.";
                        break;
                    default:
                        errorMessage = `An unexpected error occurred. Error code: ${error.code}. Message: ${error.message}.`;
                        break;
                }
                statusMessage.textContent = `Error: ${errorMessage}`;
                console.error("Geolocation Error:", error);
            }

            // Add event listener to the button
            getLocationBtn.addEventListener('click', () => {
                statusMessage.textContent = 'Searching for your location...';
                
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(showPosition, showError, {
                        enableHighAccuracy: true,
                        timeout: 5000,
                        maximumAge: 0
                    });
                } else {
                    statusMessage.textContent = "Geolocation is not supported by your browser.";
                    getLocationBtn.classList.add('hidden');
                }
            });
        });
    </script>

</body>
</html>
