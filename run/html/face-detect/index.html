<!DOCTYPE html>
<html>
<head>
    <title>Face Capture</title>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>
    <video id="video" width="720" height="560" autoplay muted></video>
    <canvas id="overlay" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');

        // 1. Start Video
        navigator.mediaDevices.getUserMedia({ video: {} })
            .then(stream => video.srcObject = stream);

        // 2. Load Models and Detect
        async function startDetection() {
            await faceapi.nets.tinyFaceDetector.loadFromUri('models');
            
            setInterval(async () => {
                const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions());
                
                detections.forEach(face => {
                    saveFace(face);
                });
            }, 2000); // Capture every 2 seconds
        }

        function saveFace(detection) {
            const canvas = document.getElementById('overlay');
            const ctx = canvas.getContext('2d');
            const { x, y, width, height } = detection.box;

            // Set canvas size to the face size
            canvas.width = width;
            canvas.height = height;

            // Draw the specific face area from video onto canvas
            ctx.drawImage(video, x, y, width, height, 0, 0, width, height);

            // Convert to Base64 and send to PHP
            const imageData = canvas.toDataURL('image/jpeg');
            
            fetch('save_face.php', {
                method: 'POST',
                body: JSON.stringify({ image: imageData }),
                headers: { 'Content-Type': 'application/json' }
            });
        }

        video.addEventListener('play', startDetection);
    </script>
</body>
</html>
