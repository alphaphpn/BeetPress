<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Verification</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .wrapper { position: relative; width: 400px; height: 400px; margin: 0 auto; border-radius: 50%; border: 4px solid #333; overflow: hidden; background: #000; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #instruction { font-size: 1.5rem; margin-top: 20px; color: #00d4ff; min-height: 40px; }
        .progress { margin-top: 10px; font-size: 0.9rem; color: #888; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Biometric Verification</h2>
    <div class="wrapper">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>
    
    <div id="instruction">Loading AI Models...</div>
    <div class="progress" id="steps">Step: 0/4</div>
    <div id="status"></div>

    <script type="module">
        import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js";

        const video = document.getElementById("webcam");
        const canvasElement = document.getElementById("output_canvas");
        const canvasCtx = canvasElement.getContext("2d");
        const instruction = document.getElementById("instruction");
        const stepsDisplay = document.getElementById("steps");
        const status = document.getElementById("status");

        let faceLandmarker;
        let runningMode = "VIDEO";
        let step = 0; // 0: Blink, 1: Left, 2: Right, 3: Up, 4: Finished
        let mediaRecorder;
        let recordedChunks = [];

        const tasks = [
            { label: "Please Blink your eyes", key: "BLINK" },
            { label: "Turn your head to the Left", key: "LEFT" },
            { label: "Turn your head to the Right", key: "RIGHT" },
            { label: "Look Up", key: "UP" }
        ];

        // Initialize MediaPipe
        async function init() {
            const filesetResolver = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm");
            faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`, delegate: "GPU" },
                outputFaceBlendshapes: true,
                runningMode: runningMode,
                numFaces: 1
            });
            startCamera();
        }

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.addEventListener("loadeddata", predictWebcam);
            
            // Start recording the session
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
            mediaRecorder.onstop = uploadVideo;
            mediaRecorder.start();
            
            instruction.innerText = tasks[0].label;
        }

        async function predictWebcam() {
            const results = faceLandmarker.detectForVideo(video, performance.now());
            
            if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                const landmarks = results.faceLandmarks[0];
                const blendshapes = results.faceBlendshapes[0].categories;
                
                // Detection Logic
                if (step === 0) { // Blink detection (Eye Blink Left + Right blendshapes)
                    const eyeBlinkL = blendshapes.find(b => b.categoryName === "eyeBlinkLeft").score;
                    const eyeBlinkR = blendshapes.find(b => b.categoryName === "eyeBlinkRight").score;
                    if (eyeBlinkL > 0.4 && eyeBlinkR > 0.4) nextStep();
                } 
                else if (step === 1 || step === 2) { // Left/Right Logic
                    const nose = landmarks[1].x;
                    const leftEdge = landmarks[234].x;
                    const rightEdge = landmarks[454].x;
                    const ratio = (nose - leftEdge) / (rightEdge - leftEdge);
                    
                    if (step === 1 && ratio < 0.35) nextStep(); // Turned Left
                    if (step === 2 && ratio > 0.65) nextStep(); // Turned Right
                }
                else if (step === 3) { // Up Logic
                    const noseY = landmarks[1].y;
                    const foreheadY = landmarks[10].y;
                    const chinY = landmarks[152].y;
                    const verticalRatio = (noseY - foreheadY) / (chinY - foreheadY);
                    if (verticalRatio < 0.4) nextStep(); // Looking Up
                }
            }
            if (step < 4) window.requestAnimationFrame(predictWebcam);
        }

        function nextStep() {
            step++;
            stepsDisplay.innerText = `Step: ${step}/4`;
            if (step < 4) {
                instruction.innerText = tasks[step].label;
            } else {
                instruction.innerText = "Verification Complete!";
                mediaRecorder.stop();
            }
        }

        async function uploadVideo() {
            status.innerText = "Uploading to server...";
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const formData = new FormData();
            formData.append('video', blob, 'verified_user.webm');

            try {
                const response = await fetch('upload.php', { method: 'POST', body: formData });
                const result = await response.json();
                status.innerText = result.status === "success" ? "Saved to server successfully!" : "Upload failed.";
            } catch (e) {
                status.innerText = "Error connecting to server.";
            }
        }

        init();
    </script>
</body>
</html>
