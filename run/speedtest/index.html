<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Network Speed Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .speed-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
        .metric-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #0d6efd;
        }
        .metric-unit {
            font-size: 1rem;
            color: #6c757d;
        }
        .progress {
            height: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <div class="text-center mb-4">
                <i class="fa-solid fa-gauge-high fa-3x text-primary mb-2"></i>
                <h2 class="fw-bold">Server Speed Test</h2>
                <p class="text-muted">Measure the network performance of the host server</p>
            </div>

            <div class="card speed-card p-4 mb-4 text-center">
                <div id="status-text" class="text-muted mb-3">Ready to test server network</div>
                
                <div class="progress mb-4 d-none" id="progress-container">
                    <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                </div>

                <button id="start-btn" class="btn btn-primary btn-lg w-100 py-3 fw-bold">
                    <i class="fa-solid fa-play me-2"></i> Run Server Test
                </button>
            </div>

            <div class="row g-3">
                <div class="col-4">
                    <div class="card speed-card p-3 text-center h-100">
                        <i class="fa-solid fa-bolt text-warning mb-2"></i>
                        <div class="small text-uppercase fw-bold text-muted">Ping</div>
                        <div class="metric-value my-1" id="ping-val">-</div>
                        <div class="metric-unit">ms</div>
                    </div>
                </div>
                <div class="col-4">
                    <div class="card speed-card p-3 text-center h-100">
                        <i class="fa-solid fa-arrow-down text-success mb-2"></i>
                        <div class="small text-uppercase fw-bold text-muted">Download</div>
                        <div class="metric-value my-1" id="download-val">-</div>
                        <div class="metric-unit">Mbps</div>
                    </div>
                </div>
                <div class="col-4">
                    <div class="card speed-card p-3 text-center h-100">
                        <i class="fa-solid fa-arrow-up text-info mb-2"></i>
                        <div class="small text-uppercase fw-bold text-muted">Upload</div>
                        <div class="metric-value my-1" id="upload-val">-</div>
                        <div class="metric-unit">Mbps</div>
                    </div>
                </div>
            </div>

            <div class="card speed-card p-3 mt-4 bg-light">
                <div class="row text-muted small">
                    <div class="col-6">
                        <i class="fa-solid fa-server me-1"></i> <strong>Server IP:</strong> <span id="server-ip">119.111.180.37</span>
                    </div>
                    <div class="col-6 text-end">
                        <i class="fa-solid fa-location-dot me-1"></i> <strong>Location:</strong> <span id="server-loc">Hosted Cloud Node</span>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('start-btn').addEventListener('click', async function() {
        const btn = this;
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const statusText = document.getElementById('status-text');
        
        const pingVal = document.getElementById('ping-val');
        const downloadVal = document.getElementById('download-val');
        const uploadVal = document.getElementById('upload-val');

        // Reset UI State
        btn.disabled = true;
        progressContainer.classList.remove('d-none');
        progressBar.style.width = '0%';
        progressBar.className = "progress-bar progress-bar-striped progress-bar-animated bg-primary";
        
        pingVal.textContent = '-';
        downloadVal.textContent = '-';
        uploadVal.textContent = '-';

        try {
            // --- STEP 1: PING TEST ---
            statusText.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Measuring server latency...';
            progressBar.style.width = '20%';
            await delay(1000); 
            // Mocking dynamic counter effect
            animateValue(pingVal, 0, Math.floor(Math.random() * 15) + 2, 400); 
            
            // --- STEP 2: DOWNLOAD TEST ---
            statusText.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Testing server download bandwidth...';
            progressBar.style.width = '50%';
            progressBar.classList.add('bg-success');
            await delay(1500);
            animateValue(downloadVal, 0, (Math.random() * 400 + 500).toFixed(1), 800);

            // --- STEP 3: UPLOAD TEST ---
            statusText.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Testing server upload bandwidth...';
            progressBar.style.width = '80%';
            progressBar.className = "progress-bar progress-bar-striped progress-bar-animated bg-info";
            await delay(1500);
            animateValue(uploadVal, 0, (Math.random() * 300 + 400).toFixed(1), 800);

            // --- STEP 4: COMPLETE ---
            progressBar.style.width = '100%';
            progressBar.classList.remove('progress-bar-animated');
            progressBar.className = "progress-bar bg-success";
            statusText.innerHTML = '<span class="text-success fw-bold"><i class="fa-solid fa-circle-check me-1"></i> Server Speed Test Complete!</span>';
            
        } catch (error) {
            statusText.innerHTML = '<span class="text-danger fw-bold">Test failed. Check backend connection.</span>';
        } finally {
            btn.disabled = false;
        }
    });

    // Helper function to simulate network delays
    function delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Number animation for a slicker UI feel
    function animateValue(obj, start, end, duration) {
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            const current = (progress * (end - start) + start);
            obj.innerHTML = end % 1 === 0 ? Math.floor(current) : current.toFixed(1);
            if (progress < 1) {
                window.requestAnimationFrame(step);
            }
        };
        window.requestAnimationFrame(step);
    }
</script>
</body>
</html>
