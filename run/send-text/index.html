<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send SMS via Textbelt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">Send SMS</h3>
            
            <div id="statusAlert" class="alert d-none" role="alert"></div>

            <form id="smsForm">
              <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" placeholder="+15555555555" required>
              </div>

              <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" rows="4" placeholder="Hello world" required></textarea>
              </div>

              <button type="submit" id="submitBtn" class="btn btn-primary w-100">Send Message</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('smsForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('statusAlert');
      const phone = document.getElementById('phone').value;
      const message = document.getElementById('message').message;

      submitBtn.disabled = true;
      submitBtn.innerText = 'Sending...';
      alertBox.className = 'alert d-none';

      // Using 'application/x-www-form-urlencoded' helps bypass strict CORS preflight checks in older browsers
      fetch('https://textbelt.com/text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          phone: phone,
          message: message,
          key: 'textbelt_test' // <-- Using 'textbelt_test' will allow you to test your connection for free
        })
      })
      .then(response => {
        if (!response.ok) throw new Error('Network response was not ok');
        return response.json();
      })
      .then(data => {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Send Message';

        if (data.success) {
          alertBox.className = 'alert alert-success';
          alertBox.innerText = `Test Success! (No actual SMS sent). Message ID: ${data.textId}`;     } else {       alertBox.className = 'alert alert-warning';       alertBox.innerText = `API Error: ${data.error}`;
        }
      })
      .catch(error => {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Send Message';
        alertBox.className = 'alert alert-danger';
        alertBox.innerText = 'Network error. Run on a local web server (e.g., Live Server) rather than opening the HTML file directly.';
        console.error('Fetch error:', error);
      });
    });
  </script>

</body>
</html>
