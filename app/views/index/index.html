
	<!-- Bootstrap 5 Modal -->
	<div class="modal fade" id="autoShowModal" tabindex="-1" aria-labelledby="autoShowModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="autoShowModalLabel">Special Offer!</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-content p-3">
					<p>This modal automatically appeared after 5 seconds using vanilla JavaScript and Bootstrap 5's JS API.</p>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
					<button type="button" class="btn btn-primary">Save Changes</button>
				</div>
			</div>
		</div>
	</div>

	<!-- JavaScript to Trigger Modal After 5 Seconds -->
	<script>
		document.addEventListener('DOMContentLoaded', function () {
			setTimeout(function () {
				const myModalElement = document.getElementById('autoShowModal');
				const myModal = new bootstrap.Modal(myModalElement);
				myModal.show();
			}, 5000); // 5000 milliseconds = 5 seconds
		});
	</script>
